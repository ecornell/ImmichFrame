name: Build and Publish image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        default: "1.0.0.0"
  push:
    tags:
      - "v*"  # Only triggers on versioned tags, e.g., v1.0, v20.15.10
  # Build (never push) every platform on PRs, so a broken image shows up before a release tag.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push to the same PR supersedes its running build; tag and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  packages: write

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The frontend stage runs per target platform, so the ARM builds need emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Login to GHCR (or other registry) except on PRs
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata (${{ env.IMAGE_NAME }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Extract version (from tag or manual input)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version || '1.0.0.0' }}" >> $GITHUB_OUTPUT
          fi

      # Build and push Docker image for multiple platforms (build only on PRs)
      - name: Build and push Docker image (${{ env.IMAGE_NAME }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
