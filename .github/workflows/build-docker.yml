name: Build and Publish image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        default: "1.0.0.0"
  push:
    tags:
      - "v*"  # Only triggers on versioned tags, e.g., v1.0, v20.15.10
    # Build (never publish) every platform on main, so a broken image shows up before a release
    # tag. Changes land by direct merge, not PRs. Path filters are not applied to tag pushes.
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push to main supersedes its running build; tag and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}

jobs:
  publish_images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every RUN stage builds on the build platform, so this is a safety net for any future
      # step that runs per target platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Only tags and manual runs publish, so only they log in.
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata (${{ env.IMAGE_NAME }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Extract version (from tag or manual input)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version || '1.0.0.0' }}" >> $GITHUB_OUTPUT
          fi

      # Build every platform; push only for tags and manual runs.
      - name: Build and push Docker image (${{ env.IMAGE_NAME }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers (notably the dotnet restore and npm ci layers) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  # Publish the GitHub release only once every image is pushed, so a release never lacks its image.
  release:
    needs: publish_images
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Changes land without PRs, so GitHub's generated notes would be empty: list the commits.
      - name: Write release notes from the git log
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
